services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-homematch}"
      POSTGRES_USER: "${POSTGRES_USER:-homematch}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-homematch_dev}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:-homematch}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:-homematch_local_secret}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-homematch}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-homematch_local_secret}"
      S3_BUCKET: "${S3_BUCKET:-homematch-images}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done;
        mc mb --ignore-existing "local/$$S3_BUCKET";
        mc anonymous set download "local/$$S3_BUCKET"

volumes:
  postgres_data:
  minio_data:
